services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admin_platform
      POSTGRES_USER: admin_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - admin-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  admin-platform-postgres:
